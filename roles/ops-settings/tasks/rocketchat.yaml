---
# RocketChat on vm700, published at https://chat.koeff.com through the Caddy edge
# stack. Version pins and the reasoning behind each of them live in
# roles/ops-settings/defaults/main.yaml under "RocketChat"; the upgrade procedure
# and its rollback are in roles/ops-settings/docs/rocketchat-portainer-upgrade.md.
#
# Run this stack on its own:
#   ansible-playbook -i protected/inventories/inventory-main.yaml \
#     playbook-index.yaml -l ops --tags rocketchat_stack
#
# Two things this file used to get wrong:
#
#   * It rendered templates/rocketchat/.env.j2, a file that does not exist and
#     never has, under `ignore_errors: true` — so every run reported a failure
#     that everyone had learned to scroll past. The compose file has no env_file
#     and no ${...} interpolation; nothing read that .env. The task is gone.
#   * It ran `docker_compose_v2` with `pull: always` against pinned tags and no
#     database dump, so an upgrade that broke migrations had nothing to go back
#     to. Rocket.Chat migrations rewrite documents in place and a downgraded
#     server will not read the migrated schema — the dump below IS the rollback.

- name: Ensure RocketChat project directory exists
  ansible.builtin.file:
    path: "{{ rocketchat_stack_dir }}"
    state: directory
    mode: '0755'

- name: Ensure Docker data directory exists on secondary disk
  ansible.builtin.file:
    path: /var/lib/docker/data
    state: directory
    mode: '0755'

- name: Create symlink for /var/lib/docker-data
  ansible.builtin.file:
    src: /var/lib/docker/data
    dest: /var/lib/docker-data
    state: link

- name: Ensure /var/lib/docker is traversable by other users
  ansible.builtin.file:
    path: /var/lib/docker
    mode: '0711' # rwx --x --x (allow traversal)

- name: Ensure target data directories exist with correct ownership
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    recurse: true
  loop:
    - { path: "{{ rocketchat_mongo_data }}", owner: '999', group: '0', mode: '0755' }
    - { path: "{{ rocketchat_uploads_data }}", owner: '999', group: '999', mode: '0777' }

# --- Pre-upgrade dump ------------------------------------------------------------
# Runs before the compose apply, and only when there is something to dump. On a
# first install rc-mongo does not exist yet and all three tasks skip.

- name: Ensure RocketChat backup directory exists
  ansible.builtin.file:
    path: "{{ rocketchat_backup_dir }}"
    state: directory
    mode: '0700'
  when: rocketchat_backup_enabled | bool

- name: Check whether rc-mongo is already running
  ansible.builtin.command: docker ps --quiet --filter 'name=^rc-mongo$'
  register: rocketchat_mongo_running
  changed_when: false
  failed_when: false
  when: rocketchat_backup_enabled | bool

- name: Dump the rocketchat database before touching the stack
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      docker exec rc-mongo mongodump --archive --gzip --db rocketchat
      > {{ rocketchat_backup_dir }}/rocketchat-{{ ansible_date_time.iso8601_basic_short }}.archive.gz
    executable: /bin/bash
  register: rocketchat_dump
  changed_when: rocketchat_dump.rc == 0
  when:
    - rocketchat_backup_enabled | bool
    - rocketchat_mongo_running.stdout | default('') | length > 0

- name: Report where the dump landed
  ansible.builtin.debug:
    msg: >-
      Pre-upgrade dump:
      {{ rocketchat_backup_dir }}/rocketchat-{{ ansible_date_time.iso8601_basic_short }}.archive.gz
      — restore with: docker exec -i rc-mongo mongorestore --archive --gzip --drop < <file>
  when: rocketchat_dump is changed

# The dump runs on every play, not only on version changes — a backup taken only
# when someone remembers to ask for one is the backup that is missing. That trades
# idempotence for safety knowingly, and it means the directory grows by ~9 MB per
# run, so it is bounded here. Only files matching this play's own naming are
# considered, and the newest rocketchat_backup_keep are always kept.
- name: Prune old RocketChat dumps
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      ls -1t {{ rocketchat_backup_dir }}/rocketchat-*.archive.gz 2>/dev/null
      | tail -n +{{ rocketchat_backup_keep | int + 1 }}
      | tr '\n' '\0' | xargs -0 -r rm -f --
    executable: /bin/bash
  register: rocketchat_prune
  changed_when: false
  when:
    - rocketchat_backup_enabled | bool
    - rocketchat_dump is changed

# --- Apply ------------------------------------------------------------------------

- name: Render RocketChat Docker Compose file
  ansible.builtin.template:
    src: rocketchat/docker-compose.yml.j2
    dest: "{{ rocketchat_stack_dir }}/docker-compose.yml"
    mode: '0644'

# This task reports `changed` on every run and that is expected, not drift. Its
# only action on a steady-state run is {"id": "rc-mongo-init", "status":
# "Starting"} — mongo-init-replica is a one-shot service with restart: "no", so
# `compose up` restarts the exited container each time. Its script is idempotent
# (rs.status() succeeds, prints "Replica set already initialized", exits) and
# rc-mongo and rocketchat are NOT recreated: verified 2026-08-17 by comparing
# container Created timestamps across consecutive runs. Restructuring the
# replica-set bootstrap to win a cosmetic changed=0 on a live chat database is
# the wrong trade; knowing which `changed` is real is the point of writing it down.
- name: Run RocketChat Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ rocketchat_stack_dir }}"
    state: present
    # `missing`, not `always`. Both image references are exact pins, so `always`
    # re-fetched the same two manifests on every run and reported changed each
    # time without recreating anything — measured on 2026-08-17: a second
    # consecutive run said changed while the container Created timestamps did not
    # move. A changed that is not a change is how real drift gets missed.
    pull: missing

# --- Verify -----------------------------------------------------------------------

- name: Wait for RocketChat to finish migrations and serve
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ rocketchat_host_port }}/api/info"
    return_content: true
  register: rocketchat_info
  retries: "{{ rocketchat_health_retries }}"
  delay: "{{ rocketchat_health_delay }}"
  until: rocketchat_info.status == 200 and rocketchat_info.json.success | default(false)
  changed_when: false

- name: Assert RocketChat is serving the pinned version
  ansible.builtin.assert:
    that:
      - rocketchat_info.json.version is version(rocketchat_version, '==')
    fail_msg: >-
      RocketChat reports {{ rocketchat_info.json.version }} but the pin says
      {{ rocketchat_version }}. /api/info reports major.minor only, so compare
      against the minor line, not the patch.
    success_msg: "RocketChat {{ rocketchat_info.json.version }} (pinned {{ rocketchat_image }})"

# The retreat from MongoDB 8.3 to 8.2 is only available while the data files are
# still at FCV 8.2 — MongoDB permits a single-version downgrade between adjacent
# releases, but only down to the FCV already in force. mongod never raises FCV on
# its own and nothing here calls setFeatureCompatibilityVersion, so this should
# always hold; it is asserted because the failure mode is silent and one-way.
- name: Read MongoDB featureCompatibilityVersion
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - rc-mongo
      - mongosh
      - --quiet
      - --eval
      - "db.adminCommand({getParameter: 1, featureCompatibilityVersion: 1}).featureCompatibilityVersion.version"
  register: rocketchat_mongo_fcv
  changed_when: false

- name: Assert the MongoDB downgrade path is still open
  ansible.builtin.assert:
    that:
      - rocketchat_mongo_fcv.stdout | trim == rocketchat_mongo_expected_fcv
    fail_msg: >-
      MongoDB featureCompatibilityVersion is {{ rocketchat_mongo_fcv.stdout | trim }},
      expected {{ rocketchat_mongo_expected_fcv }}. Someone ran
      setFeatureCompatibilityVersion. Downgrading to MongoDB
      {{ rocketchat_mongo_expected_fcv }} now requires removing every feature the
      higher FCV enabled first — see the rocketchat_mongo_image comment in
      defaults/main.yaml.
    success_msg: "MongoDB FCV {{ rocketchat_mongo_fcv.stdout | trim }} — downgrade to 8.2 remains available"

- name: Validate MongoDB storage disk
  ansible.builtin.command: docker exec rc-mongo df -h /data/db
  register: mongo_disk_check
  changed_when: false

- name: Print MongoDB storage validation
  ansible.builtin.debug:
    var: mongo_disk_check.stdout_lines
