---
- name: Define AI stack paths
  ansible.builtin.set_fact:
    ai_stack_dir: /opt/koeff-ai-stack
    ai_stack_data_dir: /var/lib/docker-data/koeff-ai-stack

- name: Ensure AI stack directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ ai_stack_dir }}", mode: "0755" }
    - { path: "{{ ai_stack_data_dir }}", mode: "0755" }
    - { path: "{{ ai_stack_data_dir }}/prometheus", mode: "0777" }
    - { path: "{{ ai_stack_data_dir }}/grafana", mode: "0777" }

- name: Render Prometheus config
  ansible.builtin.template:
    src: headroom/prometheus.yml.j2
    dest: "{{ ai_stack_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"

- name: Render Grafana datasources
  ansible.builtin.template:
    src: headroom/grafana-datasources.yaml.j2
    dest: "{{ ai_stack_dir }}/grafana-datasources.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Render Grafana dashboard provisioner
  ansible.builtin.template:
    src: headroom/grafana-dashboards.yaml.j2
    dest: "{{ ai_stack_dir }}/grafana-dashboards.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Ensure Grafana dashboards data directory
  ansible.builtin.file:
    path: "{{ ai_stack_data_dir }}/grafana/dashboards"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render AI stack compose file
  ansible.builtin.template:
    src: headroom/docker-compose.yml.j2
    dest: "{{ ai_stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

# 2026-08-31: postgres, ollama, qdrant, litellm, nginx-ingest and headroom
# were removed from this stack — the LLM-routing chain they backed
# (VS Code Claude Code ext -> headroom -> nginx-ingest -> litellm -> Anthropic)
# is retired; the extension now talks to Anthropic directly. Only
# prometheus + grafana remain.
#
# NOT remove_orphans: true here. Applying this role's own removal with that
# flag set (2026-08-31, this same change) stopped containers across the
# WHOLE host — rocketchat, omniroute, music-production-engine and even
# Caddy itself went down, not just koeff-ai-stack's own orphaned services.
# community.docker.docker_compose_v2's orphan detection did not stay scoped
# to this project the way the plain `docker compose up --remove-orphans`
# CLI reliably does. Tearing down the now-undeclared postgres/litellm/
# nginx-ingest/headroom containers is a one-time, manual step instead:
#   ssh <host> 'cd {{ ai_stack_dir }} && docker compose up -d --remove-orphans'
# — already done for the 2026-08-31 removal. Do not re-add remove_orphans
# to this task without first reproducing why the module mis-scoped it.
- name: Start koeff-ai-stack
  community.docker.docker_compose_v2:
    project_src: "{{ ai_stack_dir }}"
    state: present
    pull: always
