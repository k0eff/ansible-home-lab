---
- name: Define Headroom stack paths
  ansible.builtin.set_fact:
    headroom_stack_dir: /opt/headroom
    headroom_data_dir: /var/lib/docker-data/headroom

- name: Ensure Headroom stack directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ headroom_stack_dir }}", mode: "0755" }
    - { path: "{{ headroom_data_dir }}", mode: "0755" }
    - { path: "{{ headroom_data_dir }}/qdrant", mode: "0777" }
    - { path: "{{ headroom_data_dir }}/qdrant/storage", mode: "0777" }
    - { path: "{{ headroom_data_dir }}/headroom", mode: "0755" }
    - { path: "{{ headroom_data_dir }}/litellm", mode: "0755" }
    - { path: "{{ headroom_data_dir }}/prometheus", mode: "0777" }
    - { path: "{{ headroom_data_dir }}/grafana", mode: "0777" }
    - { path: "{{ headroom_data_dir }}/postgres", mode: "0755" }

- name: Ensure LiteLLM master key exists on remote host
  ansible.builtin.shell: |
    set -eu
    secret_file="{{ headroom_data_dir }}/litellm.masterkey"
    if [ ! -f "$secret_file" ]; then
      umask 077
      openssl rand -base64 48 | tr -d '\n' > "$secret_file"
    fi
  args:
    creates: "{{ headroom_data_dir }}/litellm.masterkey"

- name: Read LiteLLM master key from remote host
  ansible.builtin.slurp:
    src: "{{ headroom_data_dir }}/litellm.masterkey"
  register: headroom_litellm_master_key_file

- name: Set LiteLLM master key fact
  ansible.builtin.set_fact:
    headroom_litellm_master_key: "{{ headroom_litellm_master_key_file.content | b64decode | trim }}"

- name: Render LiteLLM env file
  ansible.builtin.template:
    src: headroom/litellm.env.j2
    dest: "{{ headroom_stack_dir }}/litellm.env"
    owner: root
    group: root
    mode: "0600"

- name: Render LiteLLM config file
  ansible.builtin.template:
    src: headroom/litellm-config.yaml.j2
    dest: "{{ headroom_stack_dir }}/litellm-config.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Render Prometheus config
  ansible.builtin.template:
    src: headroom/prometheus.yml.j2
    dest: "{{ headroom_stack_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"

- name: Render Grafana datasources
  ansible.builtin.template:
    src: headroom/grafana-datasources.yaml.j2
    dest: "{{ headroom_stack_dir }}/grafana-datasources.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Render Grafana dashboard provisioner
  ansible.builtin.template:
    src: headroom/grafana-dashboards.yaml.j2
    dest: "{{ headroom_stack_dir }}/grafana-dashboards.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Render LiteLLM Grafana dashboard
  ansible.builtin.template:
    src: headroom/grafana-dashboard-litellm.json.j2
    dest: "{{ headroom_stack_dir }}/grafana-dashboard-litellm.json"
    owner: root
    group: root
    mode: "0644"

- name: Render Headroom compose file
  ansible.builtin.template:
    src: headroom/docker-compose.yml.j2
    dest: "{{ headroom_stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start Headroom + LiteLLM + Qdrant stack
  community.docker.docker_compose_v2:
    project_src: "{{ headroom_stack_dir }}"
    state: present
    pull: always
