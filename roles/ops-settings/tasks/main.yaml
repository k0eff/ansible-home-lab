---

- name: Install tools
  apt:
    pkg: 
      - git
      - cmake
      - python3-paramiko
      - dos2unix
      - rsync
    state: present
    update_cache: true

- name: Configure Docker Storage
  import_tasks: storage-docker.yaml

- git_config:
    name: core.autocrlf
    scope: global
    value: false

- name: Ensure Projects
  ansible.builtin.file:
    path: /home/{{ default_user }}/Projects
    state: directory
    owner: "{{ default_user }}"
    group: "{{ default_user }}"
    mode: 0700

- name: Ensure .ssh
  ansible.builtin.file:
    path: /home/{{ default_user }}/.ssh
    state: directory

- name: Ensure .docker
  ansible.builtin.file:
    path: /home/{{ default_user }}/.docker
    state: directory
    owner: "{{ default_user }}"
    group: "{{ default_user }}"

- name: Docker
  copy:
    dest: /home/{{ default_user }}/.docker/config.json
    src: '../../../protected/docker/config.json'
    mode: u=rw,g=,o=
    owner: "{{ default_user }}"
    group: "{{ default_user }}"

- name: Ensure VS Code user settings directory
  ansible.builtin.file:
    path: /home/{{ default_user }}/Library/Application Support/Code/User
    state: directory
    owner: "{{ default_user }}"
    group: "{{ default_user }}"
    mode: '0700'

- name: Deploy chatLanguageModels.json (protected)
  copy:
    src: '../../../protected/chatLanguageModels.json'
    dest: "/home/{{ default_user }}/Library/Application Support/Code/User/chatLanguageModels.json"
    owner: "{{ default_user }}"
    group: "{{ default_user }}"
    mode: '0600'
  ignore_errors: true

- name: Keys1
  copy:
    dest: /home/{{ default_user }}/.ssh/homelab-docker.key.pub
    src: '../../../protected/keys/docker/homelab-docker.key.pub'
    mode: u=r,g=,o=

- name: Keys2
  copy:
    dest: /home/{{ default_user }}/.ssh/homelab-docker.key
    src: '../../../protected/keys/docker/homelab-docker.key'
    mode: u=r,g=,o=

- name: Ensure git ignores crlf
  command: "git config --global core.autocrlf true"


- name: Add a host in the configuration
  community.general.ssh_config:
    host: "github.com"
    identity_file: "/home/{{ default_user }}/.ssh/homelab-docker.key"

- name: Git checkout main repo
  ansible.builtin.git:
    repo: 'git@github.com:k0eff/helmfile-home-lab.git'
    dest: /home/{{ default_user }}/Projects/helmfile-home-lab
    version: main
    key_file: /home/{{ default_user }}/.ssh/homelab-docker.key
    accept_newhostkey: true
    force: true
  ignore_errors: true

- name: Git checkout protected repo
  ansible.builtin.git:
    repo: 'git@github.com:k0eff/helmfile-home-lab-protected.git'
    dest: /home/{{ default_user }}/Projects/helmfile-home-lab/protected
    version: main
    key_file: /home/{{ default_user }}/.ssh/homelab-docker.key
    accept_newhostkey: true
    force: true
  ignore_errors: true


- name: Set helmfile permissions
  ansible.builtin.file:
    path: /home/{{ default_user }}/Projects/helmfile-home-lab
    state: directory
    owner: "{{ default_user }}"
    group: "{{ default_user }}"

- name: Import Portainer setup
  import_tasks: portainer.yaml
  tags:
    - portainer_stack

- name: Import Headroom + LiteLLM + Qdrant setup
  import_tasks: headroom.yaml
  tags:
    - headroom_stack

- name: Import Playwright MCP setup
  import_tasks: playwright-mcp.yaml
  tags:
    - playwright_mcp_stack

- name: Import OmniRoute setup
  import_tasks: omniroute.yaml
  tags:
    - omniroute_stack

- name: Import Caddy edge stack setup
  import_tasks: caddy.yaml
  tags:
    - caddy_stack

- name: Verify Playwright‑MCP Docker image builds and contains Chromium
  block:
    - name: Build Playwright‑MCP Docker image on localhost
      community.docker.docker_image:
        name: playwright-mcp-test
        source: build
        build:
          path: "{{ playbook_dir }}/../.."
          dockerfile: "roles/ops-settings/templates/playwright-mcp/Dockerfile.j2"
      delegate_to: localhost

    - name: Run container to check Chromium binary on localhost
      community.docker.docker_container:
        name: playwright-mcp-test-check
        image: playwright-mcp-test
        command: which chromium-browser
        detach: false
        remove: true
      register: chromium_check
      delegate_to: localhost

    - name: Show Chromium check result
      debug:
        msg: "Chromium binary location: {{ chromium_check.stdout }}"

- name: Verify connectivity and open ports
  ansible.builtin.command: "{{ playbook_dir }}/scripts/verify_vm700.sh"
  delegate_to: localhost
  become: false
  changed_when: false

# - name: Restart Portainer container
#   community.docker.docker_container:
#     name: portainer
#     restart: true


- name: Import RocketChat setup
  import_tasks: rocketchat.yaml
  tags:
    - rocketchat_stack

