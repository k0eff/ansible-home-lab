---
# bg-laws pipeline runtime on vm700. Contract: bg-laws-pipeline/docs/spec/
# 80-queue-worker-admin.md §4 — the role is written from that section alone.
# The backfill is deliberately NOT started here (PRD 4.6: operator-started,
# once, inside tmux). This role lays the ground — user, bun, clones, env,
# wrappers, cron, logrotate — and runs the queue worker as a systemd timer
# (§4.4 amended, deviation #76). Static serving of var/admin (§3.4/§4.7
# item 7) is NOT wired yet — it needs a caddy edge change, tracked
# separately; admin build still writes the files.

# --- account (§4.1) ----------------------------------------------------------

- name: Create the bg-laws service user
  ansible.builtin.user:
    name: "{{ bg_laws_user }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Ensure the bg-laws user's .ssh directory
  ansible.builtin.file:
    path: "/home/{{ bg_laws_user }}/.ssh"
    state: directory
    owner: "{{ bg_laws_user }}"
    group: "{{ bg_laws_user }}"
    mode: "0700"

- name: Authorize the operator laptop's key (worker rsync + operator ssh)
  ansible.posix.authorized_key:
    user: "{{ bg_laws_user }}"
    state: present
    key: "{{ lookup('file', '../../../protected/keys/main/homelab-main.key.pub') }}"

- name: Install the dedicated github deploy keys for the bg-laws clones
  # Ticket 37: per-repo deploy keys (pipeline read-only, data read-write —
  # the runner pushes legal commits from vm700). Values live only in the
  # protected repo; registered on GitHub as deploy keys "vm700-bg-laws".
  ansible.builtin.copy:
    dest: "/home/{{ bg_laws_user }}/.ssh/{{ item }}"
    src: "../../../protected/keys/bg-laws/{{ item }}"
    owner: "{{ bg_laws_user }}"
    group: "{{ bg_laws_user }}"
    mode: "0600"
  loop:
    - bg-laws-pipeline-deploy.key
    - bg-laws-data-deploy.key

- name: Wire the host aliases to the deploy keys (bglaws ~/.ssh/config)
  # github.com-bg-laws-{pipeline,data} → github.com with the respective
  # IdentityFile. This is what lets cron-driven git push/fetch work with no
  # ansible around to supply key_file.
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "/home/{{ bg_laws_user }}/.ssh/config"
    owner: "{{ bg_laws_user }}"
    group: "{{ bg_laws_user }}"
    mode: "0600"

- name: Remove the retired shared deploy key from the bglaws account
  # The homelab-docker.key convention was abandoned for bg-laws (ticket 37:
  # that key is registered to no GitHub identity). Never reference it again.
  ansible.builtin.file:
    path: "/home/{{ bg_laws_user }}/.ssh/homelab-docker.key"
    state: absent

# --- binaries (§4.1) ---------------------------------------------------------

- name: Install prerequisite packages
  ansible.builtin.apt:
    pkg:
      - git
      - tmux
      - rsync
      - unzip
      - logrotate
      - util-linux   # flock
      - coreutils    # timeout
      - acl          # setfacl — ansible needs it to become the unprivileged bglaws user
    state: present
    update_cache: true

- name: Install xrdp (graphical session for the agy OAuth login)
  # The worker on this host spends the bglaws account's agy OAuth quota
  # (deviation #76); the Google OAuth flow needs a browser in a graphical
  # session, done over RDP. Installed ad-hoc on 2026-08-30 — declared here
  # so host state stays ansible-owned (one tool per layer).
  ansible.builtin.apt:
    name: xrdp
    state: present

- name: Check whether bun is already installed at the pinned version
  ansible.builtin.command: /usr/local/bin/bun --version
  register: bg_laws_bun_current
  changed_when: false
  failed_when: false

- name: Download and install bun {{ bg_laws_bun_version }} (official linux-x64 zip)
  when: bg_laws_bun_current.rc != 0 or bg_laws_bun_current.stdout | trim != bg_laws_bun_version
  block:
    - name: Download the bun release archive
      ansible.builtin.get_url:
        url: "https://github.com/oven-sh/bun/releases/download/bun-v{{ bg_laws_bun_version }}/bun-linux-x64.zip"
        dest: /tmp/bun-linux-x64.zip
        mode: "0644"

    - name: Unpack the bun archive
      ansible.builtin.unarchive:
        src: /tmp/bun-linux-x64.zip
        dest: /tmp
        remote_src: true

    - name: Install the bun binary to /usr/local/bin
      ansible.builtin.copy:
        src: /tmp/bun-linux-x64/bun
        dest: /usr/local/bin/bun
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Clean up the bun download
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/bun-linux-x64.zip
        - /tmp/bun-linux-x64

# --- layout (§4.2) -----------------------------------------------------------

- name: Ensure the bg-laws directory layout
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ bg_laws_user }}"
    group: "{{ bg_laws_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ bg_laws_root }}", mode: "0755" }
    - { path: "{{ bg_laws_root }}/logs", mode: "0755" }
    - { path: "{{ bg_laws_root }}/var", mode: "0755" }
    # Queue layout of §1.4 plus the admin output dir (§3) — created here so
    # the very first runner/worker/rsync touch never races a mkdir.
    - { path: "{{ bg_laws_root }}/var/queue", mode: "0755" }
    - { path: "{{ bg_laws_root }}/var/queue/pending", mode: "0755" }
    - { path: "{{ bg_laws_root }}/var/queue/leases", mode: "0755" }
    - { path: "{{ bg_laws_root }}/var/queue/done", mode: "0755" }
    - { path: "{{ bg_laws_root }}/var/queue/failed", mode: "0755" }
    - { path: "{{ bg_laws_root }}/var/admin", mode: "0755" }

# --- deploy-key access probe -------------------------------------------------
# Each repo has its own deploy key (unique per repo on GitHub), resolved via
# the ~/.ssh/config aliases installed above. If either remote is not
# reachable yet, everything else still deploys and the clone slice is
# reported as pending-secret instead of aborting.

- name: Probe deploy-key access to the bg-laws remotes
  ansible.builtin.command: git ls-remote {{ item }} -h refs/heads/main
  environment:
    # Identity comes from ~/.ssh/config; accept-new only pins github.com's
    # host key on first contact.
    GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new"
  loop:
    - "{{ bg_laws_pipeline_repo }}"
    - "{{ bg_laws_data_repo }}"
  register: bg_laws_repo_probe
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ bg_laws_user }}"

- name: Record whether the deploy keys can reach both repos
  ansible.builtin.set_fact:
    bg_laws_repo_access: "{{ bg_laws_repo_probe.results | rejectattr('rc', 'eq', 0) | list | length == 0 }}"

- name: Warn loudly when the clone slice is pending a secret
  ansible.builtin.debug:
    msg: >-
      PENDING-SECRET: a deploy key (protected/keys/bg-laws/) is denied for
      {{ bg_laws_repo_probe.results | rejectattr('rc', 'eq', 0) | map(attribute='item') | join(', ') }}
      — register the matching .pub as a GitHub deploy key (pipeline
      read-only, data read-write), then re-run this play. Everything except
      the clones/deps/CLI check deploys anyway.
  when: not bg_laws_repo_access

- name: Clone bg-laws-pipeline (first run only)
  # update: no — the spec's idempotency rule (§4.7) is "git fetch only,
  # never reset": the git module's update path can hard-reset a tree, and
  # the runner owns these trees. Updates happen in the guarded task below.
  ansible.builtin.git:
    repo: "{{ bg_laws_pipeline_repo }}"
    dest: "{{ bg_laws_root }}/pipeline"
    version: main
    accept_newhostkey: true
    update: false
  become: true
  become_user: "{{ bg_laws_user }}"
  when: bg_laws_repo_access

- name: Clone the bg-laws data repo (first run only; main + meta arrive with the clone)
  ansible.builtin.git:
    repo: "{{ bg_laws_data_repo }}"
    dest: "{{ bg_laws_root }}/data"
    version: main
    accept_newhostkey: true
    update: false
  become: true
  become_user: "{{ bg_laws_user }}"
  when: bg_laws_repo_access

- name: Update the pipeline tree (fetch + ff-only, under the run lock)
  # flock -n: if the backfill or the daily incremental holds the lock, skip
  # rather than swap the code out from under a running process. ff-only is
  # not a reset — local commits or divergence make this a loud no-op.
  ansible.builtin.shell: |
    flock -n {{ bg_laws_root }}/var/run.lock -c '
      cd {{ bg_laws_root }}/pipeline &&
      git fetch origin &&
      git merge --ff-only origin/main' \
    || echo LOCK_BUSY_OR_DIVERGED
  register: bg_laws_pipeline_update
  changed_when: "'Updating' in bg_laws_pipeline_update.stdout"
  become: true
  become_user: "{{ bg_laws_user }}"
  when: bg_laws_repo_access

- name: Fetch the data repo (fetch ONLY — the runner owns this tree, §4.7)
  # No GIT_SSH_COMMAND / core.sshCommand needed anywhere: the remote URL's
  # host alias + ~/.ssh/config wire the right key permanently, including
  # for the runner's cron-driven pushes.
  ansible.builtin.command:
    cmd: git fetch origin
    chdir: "{{ bg_laws_root }}/data"
  changed_when: false
  become: true
  become_user: "{{ bg_laws_user }}"
  when: bg_laws_repo_access

- name: Install pipeline dependencies (bun install --production, §4.2)
  ansible.builtin.command:
    cmd: /usr/local/bin/bun install --production --frozen-lockfile
    chdir: "{{ bg_laws_root }}/pipeline"
  register: bg_laws_bun_install
  changed_when: "'no changes' not in bg_laws_bun_install.stdout"
  become: true
  become_user: "{{ bg_laws_user }}"
  when: bg_laws_repo_access

# --- env + wrappers (§4.3, §4.4) --------------------------------------------

- name: Render the environment file (0600 even though v1 holds no secret here)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ bg_laws_root }}/env"
    owner: "{{ bg_laws_user }}"
    group: "{{ bg_laws_user }}"
    mode: "0600"
  no_log: true

- name: Install the runner wrappers
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ bg_laws_root }}/{{ item }}"
    owner: "{{ bg_laws_user }}"
    group: "{{ bg_laws_user }}"
    mode: "0755"
  loop:
    - backfill.sh
    - incremental.sh
    - start-backfill.sh

# --- cron + logrotate (§4.4, §4.6) -------------------------------------------

- name: Install the daily incremental cron
  ansible.builtin.template:
    src: bg-laws-cron.j2
    dest: /etc/cron.d/bg-laws
    owner: root
    group: root
    mode: "0644"

- name: Install logrotate for /opt/bg-laws/logs
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/bg-laws
    owner: root
    group: root
    mode: "0644"

# --- verification ------------------------------------------------------------

- name: Verify the CLI runs under the deployed env
  # `version` is the CLI's exit-0 smoke command; bare --help exits 1 by
  # design (usage, 00 §7). Proves bun + node_modules + the TS entrypoint.
  ansible.builtin.shell: |
    set -a; . {{ bg_laws_root }}/env; set +a
    cd {{ bg_laws_root }}/pipeline
    /usr/local/bin/bun run src/cli/main.ts version
  register: bg_laws_cli_check
  changed_when: false
  become: true
  become_user: "{{ bg_laws_user }}"
  when: bg_laws_repo_access

- name: Report deploy state
  ansible.builtin.debug:
    msg: >-
      bg-laws runtime deployed: bun {{ bg_laws_bun_version }},
      CLI answers "{{ bg_laws_cli_check.stdout | trim }}".
      Backfill NOT started (operator decision, PRD 4.6) — start it with:
      sudo -u {{ bg_laws_user }} {{ bg_laws_root }}/start-backfill.sh
  when: bg_laws_repo_access

# --- worker access (§2.2: a REMOTE worker rsyncs the queue over ssh) ---------
# The laptop worker is retired (the worker runs on this host now, below),
# but the access stays declared: it is deployed state, and any future
# remote worker plus operator debugging rides the same key + ACLs.

- name: Authorize the operator laptop key for the ansible user (worker rsync)
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_rsa.pub') }}"
    comment: "bg-laws worker rsync (operator laptop)"
  become: true

- name: Grant the ansible user rwx on the queue tree (worker lease/done writes)
  ansible.posix.acl:
    path: /opt/bg-laws/var/queue
    entity: "{{ ansible_user }}"
    etype: user
    permissions: rwx
    recursive: true
    state: present
  become: true

- name: Default ACL so new queue files stay writable by both sides
  ansible.posix.acl:
    path: /opt/bg-laws/var/queue
    entity: "{{ item }}"
    etype: user
    permissions: rwx
    default: true
    recursive: true
    state: present
  become: true
  loop:
    - "{{ ansible_user }}"
    - "{{ bg_laws_user }}"

# --- vm700 queue worker (§4.4 amended — deviation #76) -----------------------
# The worker itself now runs on THIS host: systemd timer → one
# `worker once` pass every 5 minutes as bglaws, remote: null (the queue is
# local, no rsync), LLM via the agy CLI on the bglaws OAuth quota
# (~/.gemini/antigravity — operator-provisioned once over xrdp, never
# managed here). The RUNNER still never enables CLI providers, and no API
# key lives on this host. The laptop launchd worker is retired.

- name: Render the vm700 worker config (remote null — the queue is local)
  ansible.builtin.template:
    src: worker.json.j2
    dest: "{{ bg_laws_root }}/worker.json"
    owner: "{{ bg_laws_user }}"
    group: "{{ bg_laws_user }}"
    mode: "0644"

- name: Install the worker tick wrapper
  ansible.builtin.template:
    src: worker-tick.sh.j2
    dest: "{{ bg_laws_root }}/worker-tick.sh"
    owner: "{{ bg_laws_user }}"
    group: "{{ bg_laws_user }}"
    mode: "0755"

- name: Install the worker systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - bg-laws-worker.service
    - bg-laws-worker.timer
  register: bg_laws_worker_units

- name: Enable and start the worker timer
  ansible.builtin.systemd_service:
    name: bg-laws-worker.timer
    enabled: true
    state: started
    daemon_reload: "{{ bg_laws_worker_units.changed }}"
