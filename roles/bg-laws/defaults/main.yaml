---
# bg-laws runtime on vm700 — written from bg-laws-pipeline/docs/spec/
# 80-queue-worker-admin.md §4 (the "vm700 runtime contract"); scheduling
# values below are that section's defaults, overridable here.

# Service account (§4.1): no sudo, owns everything under /opt/bg-laws.
bg_laws_user: bglaws
bg_laws_root: /opt/bg-laws

# Pinned bun, official linux-x64 tarball → /usr/local/bin/bun (§4.1).
# 1.3.14 is what the operator laptop runs — parity, not "latest".
bg_laws_bun_version: "1.3.14"

# Private repos, cloned over ssh with DEDICATED per-repo GitHub deploy
# keys (ticket 37: the shared homelab-docker.key is registered to no GitHub
# identity, and GitHub deploy keys are unique per repo anyway). Key VALUES
# live only in the protected repo (protected/keys/bg-laws/); only paths are
# referenced here. The host aliases resolve to github.com via the bglaws
# user's ~/.ssh/config (ssh_config.j2), which pins the right IdentityFile —
# so cron pushes work with no ansible around to supply key_file.
#   bg-laws-pipeline-deploy.key — read-only  deploy key on k0eff/bg-laws-pipeline
#   bg-laws-data-deploy.key     — read-write deploy key on k0eff/bg-laws (runner pushes)
bg_laws_pipeline_repo: "git@github.com-bg-laws-pipeline:k0eff/bg-laws-pipeline.git"
bg_laws_data_repo: "git@github.com-bg-laws-data:k0eff/bg-laws.git"

# Daily incremental + admin rebuild (§4.4), local time.
bg_laws_cron_minute: "10"
bg_laws_cron_hour: "6"

# §4.3: still NO API key on vm700 — the worker that now runs here spends
# the bglaws account's agy OAuth quota instead (deviation #76; OAuth state
# under /home/bglaws/.gemini/antigravity, operator-provisioned, never
# managed by ansible). Referenced-but-empty so the env file shape is ready
# if that decision is ever reversed. A real value would belong in
# protected/inventories/group_vars/all.yaml, never here.
bg_laws_openrouter_api_key: ""

# Queue worker on vm700 (§4.4 amended, deviation #76): systemd timer →
# one `worker once` pass as bglaws, every 5 minutes, remote: null (the
# queue is local — no rsync), LLM via the agy CLI on the bglaws OAuth
# quota. agy was installed by the operator (agy CLI installer) into the
# bglaws user's ~/.local/bin — referenced here so the unit's PATH finds it.
bg_laws_worker_id: vm700-bglaws
bg_laws_worker_on_calendar: "*:0/5"
bg_laws_worker_max_jobs_per_pass: 50
# 300s, not the spec's 120s default: measured 2026-08-30 — agy needs
# >120s to write out multi-KB consolidations of the biggest units, and a
# local worker has no rsync window to protect. Ticks never overlap anyway
# (var/worker.lock), so a slow job just stretches the pass.
bg_laws_worker_request_timeout_ms: 300000
bg_laws_agy_dir: "/home/{{ bg_laws_user }}/.local/bin"
