---
# The Krasi share and the duplicate scan that reads it.
#
# All of this used to be hand-made: cifs-utils installed ad hoc, the mount typed at a
# shell with the password on the command line, /opt/nasdedup copied in with scp. The
# 2026-09-05 rebuild of vm700 wiped every part of it that was not a file under /opt,
# and the scan had no share to read until a human came back. Hence this role.

- name: Install the CIFS client
  ansible.builtin.apt:
    pkg:
      - cifs-utils
    state: present
    update_cache: true

- name: Refuse to render an empty credential
  # A missing variable would otherwise produce a valid-looking file with an empty
  # password, and the mount would fail at boot with an authentication error that
  # says nothing about the real cause.
  ansible.builtin.assert:
    that:
      - nas_smb_user | default('') | length > 0
      - nas_smb_password | default('') | length > 0
    fail_msg: >-
      nas_smb_user / nas_smb_password are not set. They belong in
      protected/inventories/group_vars/all.yaml, never in this repository.

- name: Install the share credentials
  ansible.builtin.template:
    src: nasdedup-krasi.cred.j2
    dest: "{{ nasdedup_cred_file }}"
    owner: root
    group: root
    mode: "0600"
  notify: Remount the Krasi share

- name: Ensure the mount point
  ansible.builtin.file:
    path: "{{ nasdedup_mount }}"
    state: directory
    mode: "0755"

- name: Install the mount unit
  ansible.builtin.template:
    src: mnt-krasi.mount.j2
    dest: "/etc/systemd/system/{{ nasdedup_mount_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify: Remount the Krasi share

- name: Enable and start the mount
  ansible.builtin.systemd_service:
    name: "{{ nasdedup_mount_unit }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Verify the share is mounted read-only
  # The scan's entire safety case is that this host cannot write to a share with no
  # backup. If that ever stops being true, the run must fail here and not later.
  ansible.builtin.command:
    cmd: findmnt -no OPTIONS --target {{ nasdedup_mount }}
  register: nasdedup_mount_opts
  changed_when: false

- name: Fail if the share came back writable
  ansible.builtin.assert:
    that:
      - "'ro' in nasdedup_mount_opts.stdout.split(',')"
    fail_msg: >-
      {{ nasdedup_mount }} is mounted {{ nasdedup_mount_opts.stdout }} — expected ro.
      Refusing to continue: the Krasi share has no backup anywhere.

- name: Ensure the nasdedup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nasdedup_user }}"
    group: "{{ nasdedup_user }}"
    mode: "0755"
  loop:
    - "{{ nasdedup_root }}"
    - "{{ nasdedup_state }}"

- name: Deploy the scanner and the analysis scripts
  # The analysis tools ship with the scanner because they were lost with it: they
  # lived only in /tmp, and the rebuild took ten hours of perceptual verification
  # with them.
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ nasdedup_root }}/{{ item }}"
    owner: "{{ nasdedup_user }}"
    group: "{{ nasdedup_user }}"
    mode: "0755"
  loop:
    - nasdedup.py
    - verify_gphotos.py
    - picture_check.py
    - build_pairs.py
    - fingerprint_video.py
    - analyze_exported.py
    - containment.py
    - dense_hash.py
    - audio_match.py
    - build_quarantine.py
    - validate_quarantine.py
    - verify_trees.py
    - raw_preview.py

- name: Install the scan units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - nasdedup.service
    - nasdedup-resume.service
    - nasdedup-resume.timer
  notify: Reload systemd

- name: Set the resume timer's state
  # The timer is the only thing that starts the scan, so it is the switch: stopped and
  # disabled unless nasdedup_run_pass asks for a pass (#1551). Stopped first, so it
  # cannot fire between the service being stopped and itself being stopped.
  ansible.builtin.systemd_service:
    name: nasdedup-resume.timer
    enabled: "{{ nasdedup_run_pass | bool }}"
    state: "{{ 'started' if nasdedup_run_pass | bool else 'stopped' }}"
    daemon_reload: true

- name: Set the scan service's state
  # Never enabled at boot: a service that starts itself on every boot would re-read
  # four terabytes for nothing; the timer resumes an unfinished pass instead. With no
  # pass requested it is stopped — SIGTERM checkpoints the scan's state to SQLite.
  ansible.builtin.systemd_service:
    name: nasdedup.service
    enabled: false
    state: "{{ omit if nasdedup_run_pass | bool else 'stopped' }}"
    daemon_reload: true

- name: Remove the Docker leftovers
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ nasdedup_docker_leftovers }}"

# With no pass requested the scan is finished, so its outcome must be on disk and
# valid. While a pass runs the plan does not exist yet, so the checks are skipped.
- name: Look for the quarantine plan
  ansible.builtin.stat:
    path: "{{ nasdedup_quarantine_plan }}"
  register: nasdedup_plan
  when: not nasdedup_run_pass | bool

- name: Fail if the quarantine plan is missing
  ansible.builtin.assert:
    that:
      - nasdedup_plan.stat.exists
    fail_msg: >-
      {{ nasdedup_quarantine_plan }} does not exist. The scan is stopped, so its
      outcome must be on disk: build it with build_quarantine.py.
  when: not nasdedup_run_pass | bool

- name: Validate the quarantine plan against the owner's rules
  # Read-only: the validator only reads the plan, dedup.db and gp_verified.json.
  ansible.builtin.command:
    cmd: python3 {{ nasdedup_root }}/validate_quarantine.py {{ nasdedup_quarantine_plan }}
    chdir: "{{ nasdedup_quarantine_plan | dirname }}"
  become: true
  become_user: "{{ nasdedup_user }}"
  changed_when: false
  when: not nasdedup_run_pass | bool
