---

- name: Default machine setup
  hosts: everyone
  become: true
  gather_facts: false
  roles:
  - credentials
  - config
  - packages

- name: Ops machine setup
  hosts: ops
  become: true
  gather_facts: true
  roles:
  - credentials
  - config
  - packages
  - geerlingguy.docker
  - ops-settings
  - prometheus.prometheus.node_exporter
  # bg-laws pipeline runtime (bg-laws-pipeline/docs/spec/80 §4). Tag-scoped
  # so it can be applied alone: ... playbook-index.yaml -l ops --tags bg_laws
  - role: bg-laws
    tags: [bg_laws]


- name: Disk storage setup
  hosts: diskstorage
  become: true
  gather_facts: true
  roles:
  - credentials
  - config
  - packages
  - geerlingguy.samba
  - diskstorage-settings
  - prometheus.prometheus.node_exporter
